<div class="container">
  <div class="row mt-5">
      <div class="col-md-8 mx-auto">
          <form (ngSubmit)="onCreate()" novalidate #f="ngForm">
              <div class="form-group">
                  <label for="nombre">Nombre</label>
                  <input type="text" class="form-control" id="nombre" name="nombre"
                  [(ngModel)]="nombre" required>
              </div>
              <div class="form-group">
                <label for="direccion">Direcci&oacute;n</label>
                <input type="text" class="form-control" id="direccion" name="direccion"
                [(ngModel)]="direccion" required>
              </div>
              <div class="form-group">
                <label for="telefono">Tel&eacute;fono</label>
                <input type="text" class="form-control" id="telefono" name="telefono"
                [(ngModel)]="telefono" required>
              </div>
              <div class="form-group">
                <label for="correo">Correo</label>
                <input type="email" class="form-control" id="correo" name="correo"
                [(ngModel)]="correo" required>
              </div>
              <div class="form-group">
                <label for="pais">Pa&iacute;s</label>
                <input type="text" class="form-control" id="pais" name="pais"
                [(ngModel)]="pais" required>
              </div>
              <div class="form-group">
                <label for="fechaFundacion">Fecha Fundaci&oacute;n</label>
                <input type="text" class="form-control" id="fechaFundacion" name="fechaFundacion"
                [(ngModel)]="fechaFundacion" required>
              </div>
              <div class="form-group">
                <label for="logo">Logo</label>
                <input type="text" class="form-control" id="logo" name="logo"
                [(ngModel)]="logo" required>
              </div>
              <button class="btn btn-outline-success btn-block" [disabled]="!f.valid">
                  <i class="fas fa-plus-circle"></i> Crear</button>
              <button class="btn btn-outline-primary btn-block" (click)="volver()">
                  <i class="fas fa-arrow-alt-circle-left"></i> Volver</button>
          </form>
      </div>
  </div>
</div>
