
      <div class="text-certer" *ngIf="isLogged; else loggedOut">
        <h2>Ya has iniciado sesion</h2>
      </div>

      <ng-template #loggedOut>
        <div class="container d-flex justify-content-center">
          <div class="card">
            <div class="card-header">
              <ul class="nav nav-tabs">
                <li class="nav-item">
                  <a class="nav-link active" routerLink="/login">Iniciar Sesión</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link"routerLink="/registro">Registrarse</a>
                </li>
              </ul>
            </div>
            <div class="card-body">
              <form #f="ngForm" (ngSubmit)="onLogin()" novalidate>
                  <div class="form-group">
                    <label for="usuario">Nombre de Usuario</label>
                    <input type="text" name="usuario" id="usuario" class="form-control"
                      [(ngModel)] ="usuario" required>
                  </div>
                  <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control"
                      [(ngModel)] ="password" required>
                  </div>
                  <div class="form-group">
                    <button class="btn btn-outline-success btn-block" [disabled]="!f.valid">Iniciar Sesión</button>
                  </div>
              </form>
              <div *ngIf="f.submitted && isLoginFail" class="alert alert-danger mt-3">
                Error en el login: {{errMsj}}
              </div>
            </div>
          </div>
        </div>
      </ng-template>
