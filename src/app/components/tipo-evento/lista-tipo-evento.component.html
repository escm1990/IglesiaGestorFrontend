<div class="container-fluid page">
  <div class="d-flex page__box p-3 mt-2">Tipo Evento</div>
  <div class="page__content shadow p-3 position-relative">

      <div class="container">
        <table class="table table-bordered table-striped table-hover"
        datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger">
          <thead>
            <tr>
              <th scope="col">Id</th>
              <th scope="col">Nombre</th>
              <th scope="col">Ver</th>
              <th scope="col">Editar</th>
              <th scope="col">Borrar</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let tipoEvento of TiposEventos">
              <td>{{tipoEvento.id}}</td>
              <td>{{tipoEvento.descripcion}}</td>
              <td><button class="btn btn-outline-primary" routerLink="/dashboard/tipo_evento/detalle/{{tipoEvento.id}}"><i class="far fa-eye"></i> Ver</button></td>
              <td><button class="btn btn-outline-warning" routerLink="/dashboard/tipo_evento/editar/{{tipoEvento.id}}"><i class="far fa-edit"></i> Editar</button></td>
              <td><button class="btn btn-outline-danger" (click)="borrar(tipoEvento.id)"><i class="far fa-trash-alt"></i> Eliminar</button></td>
            </tr>
          </tbody>
        </table>
        <div class="mt-3">
          <button class="btn btn-outline-success btn-lg" routerLink="/dashboard/tipo_evento/nuevo">
            <i class="fas fa-plus-circle"></i> Nueva Tipo Evento</button>
        </div>

  </div>
</div>
