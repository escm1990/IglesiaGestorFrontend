<div class="container-fluid page">
  <div class="d-flex page__box p-3 mt-2">Miembro</div>
  <div class="page__content shadow p-3 position-relative">

      <div class="container">
        <table class="table table-sm">
          <thead>
            <tr>
              <th scope="col">Id</th>
              <th scope="col">Nombre</th>
              <th scope="col">Ver</th>
              <th scope="col" *ngIf="isAdmin">Editar</th>
              <th scope="col" *ngIf="isAdmin">Borrar</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let miembro of Miembros">
              <td>{{miembro.id}}</td>
              <td>{{miembro.nombre}} {{miembro.apellido}}</td>
              <td><button class="btn btn-outline-primary" routerLink="/dashboard/miembro/detalle/{{miembro.id}}"><i class="far fa-eye"></i> Ver</button></td>
              <td *ngIf="isAdmin"><button class="btn btn-outline-warning" routerLink="/dashboard/miembro/editar/{{miembro.id}}"><i class="far fa-edit"></i> Editar</button></td>
              <td *ngIf="isAdmin"><button class="btn btn-outline-danger" (click)="borrar(miembro.id)"><i class="far fa-trash-alt"></i> Eliminar</button></td>
            </tr>
          </tbody>
        </table>
        <div class="mt-3" *ngIf="isAdmin">
          <button class="btn btn-outline-success btn-lg" routerLink="/dashboard/miembro/nuevo">
            <i class="fas fa-plus-circle"></i> Nuevo Miembro</button>
        </div>

  </div>
</div>
