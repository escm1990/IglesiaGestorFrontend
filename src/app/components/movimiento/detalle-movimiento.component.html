<div class="container-fluid page">
  <div class="d-flex page__box p-3 mt-2">Detalle de Evento<i class="fas fa-person-carry    "></i></div>
  <div class="page__content shadow p-3 position-relative">
     <div class="container">
        <div class="row" *ngIf="movimiento">
           <div class="col-md-11 mx-auto">
              <ul class="list-group list-group-flush">
                 <li class="list-group-item"><b>C&oacute;digo: </b>{{movimiento.id}}</li>
                 <li class="list-group-item"><b>Descripci&oacute;n: </b>{{movimiento.descripcion}}</li>
                 <li class="list-group-item"><b>Fecha: </b>{{fechaMostrar}}</li>
              </ul>
              <div class="card-footer">
                 <button class="btn btn-outline-primary btn-block" (click)="volver()"><i class="fas fa-arrow-alt-circle-left"></i> Volver</button>
                 &nbsp; &nbsp;<button *ngIf="isAdmin" class="btn btn-outline-success btn-block" routerLink="/dashboard/evento-detalle/nuevo"> <i class="fas fa-plus-circle"></i> Agregar Registro</button>
                 &nbsp; &nbsp;<button *ngIf="isAdmin && isExcelFile" class="btn btn-outline-danger btn-block" (click)="guardarCargaExcel()"> <i class="fas fa-plus-circle"></i> Guardar Registros</button>

                 &nbsp; &nbsp;<input type="file" (change)="onChange($event)" #inputFile> <button (click)="removeData()">Limpiar</button>
                  <div *ngIf="isExcelFile === false">
                    No se ha seleccionado un archivo de Excel v&aacute;lido
           </div>
        </div>
     </div>

  </div>
</div>
