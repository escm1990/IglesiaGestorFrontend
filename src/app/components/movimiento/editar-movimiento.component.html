<div class="container-fluid page">
  <div class="d-flex page__box p-3 mt-2">Editar Movimiento<i class="fas fa-person-carry    "></i></div>
  <div class="page__content shadow p-3 position-relative">

<div class="container" *ngIf="movimiento">
  <div class="row">
    <div class="col-md-11 mx-auto">
        <form novalidate  (ngSubmit)="onUpdate()"  [formGroup]="formMovimiento">

          <div class="form-group">
            <mat-label>Descripcion </mat-label>
            <input name="descripcion"  class="form-control" formControlName="descripcion" type="text" />
          </div>
          <div class="alert alert-danger"
            *ngIf="formMovimiento.get('descripcion')?.hasError('required') && formMovimiento.get('descripcion')?.touched">
            Campo requerido
          </div>

          <div class="form-group">
            <mat-label>Fecha: </mat-label>
            <input matInput [matDatepicker]="picker" formControlName="fecha"
            class="form-control" (dateChange)="onDate($event)">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker disabled="false"></mat-datepicker>
          </div>
          <div class="alert alert-danger"
          *ngIf="formMovimiento.get('fecha')?.hasError('required') && formMovimiento.get('fecha')?.touched">
          Campo requerido
          </div>

          <br>
          <div class="card-footer">
            <button class="btn btn-outline-success btn-block" [disabled]="formMovimiento.invalid">
              <i class="fas fa-pencil-alt"></i> Actualizar</button>
              &nbsp;&nbsp;<button class="btn btn-outline-primary btn-block" (click)="volver()">
              <i class="fas fa-arrow-alt-circle-left"></i> Volver</button>
            </div>
        </form>
      </div>
  </div>
</div>
</div>
</div>
