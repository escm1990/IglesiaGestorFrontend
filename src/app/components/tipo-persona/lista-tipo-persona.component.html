<div class="container-fluid page">
  <div class="d-flex page__box p-3 mt-2">Tipo Persona <i class="fas fa-person-carry    "></i></div>
  <div class="page__content shadow p-3 position-relative">

      <div class="container">
        <table class="table table-sm">
          <thead>
            <tr>
              <th scope="col">Id</th>
              <th scope="col">Descripci&oacute;n</th>
              <th scope="col">Ver</th>
              <th scope="col">Editar</th>
              <th scope="col">Borrar</th>
            </tr>
          </thead>
          <tbody>

              <tr *ngFor="let tipoPersona of TiposPersona">
                <td>{{tipoPersona.id}}</td>
                <td>{{tipoPersona.descripcion}}</td>
                <td><button class="btn btn-outline-primary" routerLink="/dashboard/tipo_persona/detalle/{{tipoPersona.id}}"><i class="far fa-eye"></i> Ver</button></td>
              <td><button class="btn btn-outline-warning" routerLink="/dashboard/tipo_persona/editar/{{tipoPersona.id}}"><i class="far fa-edit"></i> Editar</button></td>
              <td><button class="btn btn-outline-danger" (click)="borrar(tipoPersona.id)"><i class="far fa-trash-alt"></i> Eliminar</button></td>
              </tr>
          </tbody>
        </table>
        <div class="mt-3">
          <button class="btn btn-outline-success btn-lg" routerLink="/dashboard/tipo_persona/nuevo">
            <i class="fas fa-plus-circle"></i> Nuevo Tipo Persona</button>
        </div>
  </div>
</div>
